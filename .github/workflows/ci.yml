name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node-tests:
    strategy:
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Translation dry-run smoke test
        run: npm run dataset:translate -- --input data/fixtures/tiny.json --provider groq --model ci-placeholder --dry-run
      - name: Public seed CLI syntax check
        run: node --check scripts/seed/public.mjs

  python-engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          pip install --disable-pip-version-check -r embedding-service/requirements.txt
      - run: PYTHONPATH=embedding-service python -m unittest discover -s embedding-service/tests -v

  qdrant-integration:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Wait for Qdrant
        run: |
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:6333/collections && exit 0
            sleep 1
          done
          exit 1
      - run: npm run test:integration
        env:
          RUN_QDRANT_INTEGRATION: '1'
          QDRANT_PROVIDER: local
          QDRANT_LOCAL_URL: http://127.0.0.1:6333
